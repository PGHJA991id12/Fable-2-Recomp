# Time-gated tick of a ring-buffer object (vtable method, NO static call
# sites — invoked through virtual dispatch). Args: obj (r3). Guards:
# obj->212 == 0, obj->56 != 0, obj->208 != 0. Layout: obj->188 = capacity,
# obj->216 = write cursor, obj->228 = read cursor, obj->192 = watermark W,
# obj->184 = buffer pointer P, obj->244 = fill byte, obj->236 = last tick
# time, obj->240 = tick rate limit (ms), obj->92 = consumer sub-object S.
# Flow: now = GetElapsedMsSinceStart(); if (now - obj->236 > 12) skip the
# space check (starvation override). free = (write - read) mod capacity
# (standard formula, both branches verified). If free >= 1024 the candidate
# length is (free - 1024) & ~3 (keeps a 1024-byte reserve, 4-aligned), else
# 0. Watermark gates vs obj->192/obj->232 (flag obj->220 bypasses). When it
# passes: obj->84 = 1, then MemSet (sub_82CA3190) fills 2*W bytes at
# P + write with byte obj->244 (two chunks if it wraps capacity), and the
# write cursor advances 2*W mod capacity. Then a probe loop calls
# sub_82CD2DF8(S, &out) (three probes, looping while the out-difference is
# >= 1024) and stores the final probe result into the READ cursor (obj->228)
# plus now into obj->236; if (now - old236 >= obj->240) it re-enters the
# fill step, else re-checks free space. Returns 1 (acted) or 0 (skipped).
# Hypothesis: 8-bit audio silence padding (fill byte would be 0x80 = signed
# silence; the sibling family does XOR-0x80 sample conversion and the 12 ms
# / 1024-byte constants fit sample streaming) — but the fill byte and the
# consumer probe are runtime values, so the name stays mechanism-based.
[entrypoint.functions."0x832B68A0"]
name = "RingBuffer_TickPadWithFillByte_832B68A0"

# Priority-ordered multi-mutex arbitration loop. Args: manager M (r3).
# Layout: M->0 = state (must be 1 to accept requests), M->24 = pending-list
# head, M->28 = monotonically increasing generation counter (incremented
# once per entry). Node layout (16-byte stride vtable at node->0..20, next
# at node->8): node->4 = mutex handle, node->12 = priority, node->16 =
# "prepare" vtable slot, node->20 = "granted" vtable slot. Loop: while
# M->0 == 1 and the pending list is non-empty, drain every pending node
# (linked through node->0): priority = vcall node->16(node, M->28);
# node->12 = priority; priority 0 = skip; otherwise insert the node into an
# acquired list sorted by DESCENDING priority (higher priority toward the
# head, linked through node->8). After each drain pass, build stack arrays
# (cap 64): handles[i] = node->4, objs[i] = node, then
# ret = KeWaitForMultipleObjects_NoApcRetry(count, handles, mode=0
# (WaitAll), timeout=1ms). If ret >= count (timeout/APC) the loop drains
# again; on success (ret = 0) it runs the "granted" callback vcall
# objs[ret]->20(objs[ret]) and immediately MutexUnlock_ReleaseMutant
# (handles[ret]) — the highest-priority requester is notified and its gate
# released, while the remaining acquired mutexes stay held (released by
# sibling family methods). Sole caller: sub_832B8DA8, a sibling method that
# first locks M->8 and M->20 (MutexLock_WaitInfinite) and gates the call on
# M->24 != 0, i.e. the pending head — confirming the layout.
[entrypoint.functions."0x832B8C28"]
name = "PriorityArbitrate_PendingMutexRequests_832B8C28"

