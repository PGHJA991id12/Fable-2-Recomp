# Time/clock family.
#
# The game's master millisecond clock, cached in a global singleton:
# returns *( *(0x82000908) + 16 ) — no arguments. 147 call sites in 89 files,
# almost all of the form "stw r3, N(obj)" storing it into per-object timestamp fields
# (lastUpdate/startTime/nextFire); a few compare against an adjacent
# previous-time field (32-bit wrap handling) or double-sample it (before/
# after bracketing, e.g. sub_8237E3E0 stores two reads 4 bytes apart).
# Millisecond scale proven by callers: rate limiters compute
# consumption = rate * (now - last) / 1000 (sub_82FFA508), poll loops use
# deadline = saved + 100 (sub_82388658), and the 2^30 jump guard in
# GetElapsedMsSinceStart below only makes sense in ms (~12.4 days).
