# Kernel wait wrappers (KeWait* re-implemented over the Nt* syscalls)
#
# WARNING on the _Guest suffix: do NOT name these bare "KeWaitForSingleObject"
# / "KeWaitForMultipleObjects". Codegen emits the body as
# __imp__<name>, and rexruntimed.dll also exports __imp__KeWaitForSingleObject
# / __imp__KeWaitForMultipleObjects (the real xboxkrnl XAPI hooks). A local
# definition silently shadows the DLL import, so the XAPI import thunks
# (0x832B28AC / 0x832B2CDC, registered in fable_2_register.cpp) would resolve
# to the guest wrapper instead of the SDK kernel hook. The wrapper expects
# millisecond timeouts in the LpWakeTime field while XAPI callers pass kernel
# 100ns LARGE_INTEGERs (0 = infinite there!), which broke all audio/video
# worker-thread waits. Any future name must not collide with a rexruntimed.dll
# export (strip the __imp__ prefix and compare; see tools/check_manifest_collisions.py).
# Fills the NTAPI_WAIT_ENTRY LpWakeTime from a millisecond timeout:
# -1 (INFINITE) -> 0, otherwise timeoutMs * -10000 (relative, 100ns units).
# Called constantly (every alertable event/mutex wait funnels through it).
[entrypoint.functions."0x822D7508"]
name = "WaitEntrySetLpWakeTime"

# Alertable KeWaitForSingleObject (guest-image-internal): NtWaitForSingleObjectEx(Alertable=1),
# loops on STATUS_USER_APC (257) while a timeout was given.
[entrypoint.functions."0x822D74A0"]
name = "KeWaitForSingleObject_Guest"

# Alertable KeWaitForMultipleObjects (guest-image-internal): count <= 64 (KE_WAIT_VARIABLE limit),
# NtWaitForMultipleObjectsEx, loops on STATUS_USER_APC (257).
[entrypoint.functions."0x822D7528"]
name = "KeWaitForMultipleObjects_Guest"

# SDK mutex family (Xbox 360 mutexes are mutants).
#
# Lock side: 2-instruction thunk, r5 = 0 then tail-calls KeWaitForSingleObject_Guest.
# Timeout 0 -> WaitEntrySetLpWakeTime writes LpWakeTime = 0 (no timer) so the
# wait is INFINITE, not a zero-wait poll (and -1 also maps to 0, so 0 cannot
# mean "don't block" or INFINITE would be unexpressible). Blocks until the
# object is signaled; APCs are not retried (timeout==0), so STATUS_USER_APC
# (257) can be returned. r4 (wait reason) is ignored by the wrapper; callers
# still pass -1/0/flags in it. 42 call sites: audio/video/rendering worker
# threads blocking on per-object handles, SDK alert/exit loops. Paired with
# MutexUnlock_ReleaseMutant (0x83004F30) at sites such as sub_832B8DA8.
[entrypoint.functions."0x82196C58"]
name = "MutexLock_WaitInfinite"

# Unlock side: NtReleaseMutant(handle, NULL). Returns 1 on success; on
# failure logs the NTSTATUS through sub_82CC1C38 (same error logger as
# KeWaitForSingleObject_Guest) and returns 0. 22 call sites, the release half of
# the lock pairs that acquire via MutexLock_WaitInfinite.
[entrypoint.functions."0x83004F30"]
